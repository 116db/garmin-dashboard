[phases.setup]
nixPkgs = ["curl", "bash"]

[phases.install]
cmds = [
  "npm install",
  "curl -fsSL https://raw.githubusercontent.com/eddmann/garmin-connect-cli/main/install.sh | sh",
  "mkdir -p /root/.local/bin",
  "cp ~/.local/bin/garmin-connect /usr/local/bin/garmin-connect || true"
]

[start]
cmd = "npm start"